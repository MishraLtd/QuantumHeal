        -webkit-appearance: none;

        outline: none;

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE_URL = "/api";
    // Safe Recharts extraction with fallbacks to prevent white-screens
    const Recharts = window.Recharts || {};
    const FallbackComponent = ({children}) => <div className="flex items-center justify-center h-full w-full text-slate-500 bg-slate-800/20 border border-dashed border-slate-700 rounded-lg">{children || 'Chart library unavailable'}</div>;
    
    const ResponsiveContainer = Recharts.ResponsiveContainer || FallbackComponent;
    const BarChart = Recharts.BarChart || (() => null);
    const Bar = Recharts.Bar || (() => null);
    const XAxis = Recharts.XAxis || (() => null);
    const YAxis = Recharts.YAxis || (() => null);
    const CartesianGrid = Recharts.CartesianGrid || (() => null);
    const Tooltip = Recharts.Tooltip || (() => null);
    const Legend = Recharts.Legend || (() => null);
    const LineChart = Recharts.LineChart || (() => null);
    const Line = Recharts.Line || (() => null);
    const AreaChart = Recharts.AreaChart || (() => null);
    const Area = Recharts.Area || (() => null);
    const Radar = Recharts.Radar || (() => null);
    const RadarChart = Recharts.RadarChart || (() => null);
    const PolarGrid = Recharts.PolarGrid || (() => null);
    const PolarAngleAxis = Recharts.PolarAngleAxis || (() => null);
    const PolarRadiusAxis = Recharts.PolarRadiusAxis || (() => null);

    // --- CONFIG & MOCK DATA ---
    const CONFIG = {
        stats: {
                accuracy: 93.4,

                sensitivity: 91.2,
                specificity: 94.1
            }
        };

        const BENCHMARK_DATA = [
            { name: 'Accuracy', VQC: 93.4, SVM: 92.1, RF: 91.5 },
            { name: 'Sensitivity', VQC: 91.2, SVM: 89.5, RF: 90.0 },
            { name: 'Specificity', VQC: 94.1, SVM: 93.0, RF: 92.5 },
            { name: 'F1 Score', VQC: 92.6, SVM: 91.0, RF: 90.7 },
        ];

        const EXPLAINABILITY_DATA = [
            { feature: 'Mean Radius', importance: 0.25 },
            { feature: 'Worst Perimeter', importance: 0.22 },
            { feature: 'Mean Texture', importance: 0.18 },
            { feature: 'Worst Area', importance: 0.15 },
            { feature: 'Mean Smoothness', importance: 0.10 },
            { feature: 'Other', importance: 0.10 },
        ];

        const DELIVERY_TABLE = [
            { id: 1, deliverable: 'Hybrid Architecture Design', desc: 'Classical pre-processing + 4-qubit VQC + fusion layer', status: 'Delivered', phase: 1 },
            { id: 2, deliverable: 'Data Pre-processing Pipeline', desc: 'Cleaning, scaling, PCA, angle encoding', status: 'Delivered', phase: 1 },
            { id: 3, deliverable: 'PennyLane VQC Model', desc: 'Implemented on Breast Cancer Wisconsin dataset', status: 'Delivered', phase: 1 },
            { id: 4, deliverable: 'Classical Baselines', desc: 'SVM and Random Forest comparisons', status: 'Delivered', phase: 1 },
            { id: 5, deliverable: 'Explainability Module', desc: 'Permutation importance, basic SHAP', status: 'Delivered', phase: 2 },
            { id: 6, deliverable: 'Uncertainty Quantification', desc: 'Shot-based quantum prediction uncertainty bands', status: 'Delivered', phase: 2 },
            { id: 7, deliverable: 'Multimodal Fusion', desc: 'Late fusion (tabular + synthetic imaging)', status: 'Partial', phase: 2 },
            { id: 8, deliverable: 'Clinician Dashboard UI', desc: 'Interactive React frontend', status: 'Delivered', phase: 2 },
            { id: 9, deliverable: 'REST API', desc: 'FastAPI backend endpoints (/predict, /health)', status: 'Delivered', phase: 3 },
            { id: 10, deliverable: 'Hardware Backend Switch', desc: 'Simulator vs Qiskit Aer vs IBM Quantum', status: 'Partial', phase: 3 },
            { id: 11, deliverable: 'Real Imaging Dataset integration', desc: 'Replace synthetic images with real medical dataset', status: 'Planned', phase: 3 },
            { id: 12, deliverable: 'Federated Learning Design', desc: 'Architecture for privacy-preserving training', status: 'Planned', phase: 3 },
        ];

        const MOCK_PATIENTS = {
            benign: { radius: 12.0, texture: 15.0, perimeter: 75.0, area: 450.0, smoothness: 0.09 },
            malignant: { radius: 19.5, texture: 22.0, perimeter: 130.0, area: 1200.0, smoothness: 0.11 }
        };

        // --- ICONS (SVG Components) ---
        const IconActivity = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        );
        const IconNetwork = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>
        );
        const IconShield = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        );
        const IconCpu = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
        );
        const IconCheck = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const IconChevronRight = ({ size=24, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
        );

        // --- SHARED COMPONENTS ---
        const Card = ({ children, className = "", title, subtitle, icon: Icon }) => (
            <div className={`glass-panel rounded-2xl p-6 flex flex-col ${className}`}>
                {(title || Icon) && (
                    <div className="flex items-center gap-3 mb-4">
                        {Icon && <div className="p-2 rounded-lg bg-teal-400/10 text-teal-400"><Icon size={20} /></div>}
                        <div>
                            {title && <h3 className="font-heading font-semibold text-lg text-white">{title}</h3>}
                            {subtitle && <p className="text-sm text-slate-400">{subtitle}</p>}
                        </div>
                    </div>
                )}
                <div className="flex-grow">
                    {children}
                </div>
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled=false }) => {
            const baseStyle = "inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-teal-500 hover:bg-teal-400 text-navy-900 shadow-[0_0_15px_rgba(20,224,196,0.3)] hover:shadow-[0_0_25px_rgba(20,224,196,0.5)]",
                secondary: "bg-surface hover:bg-surfaceHover text-white border border-slate-700 hover:border-slate-500",
                outline: "border-2 border-teal-500/50 text-teal-400 hover:bg-teal-500/10",
                ghost: "text-slate-300 hover:text-white hover:bg-white/5"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Badge = ({ children, status }) => {
            const colors = {
                'Delivered': 'bg-green-500/10 text-green-400 border-green-500/20',
                'Partial': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                'Planned': 'bg-slate-500/10 text-slate-400 border-slate-500/20',
                'default': 'bg-teal-500/10 text-teal-400 border-teal-500/20'
            };
            const colorClass = colors[status] || colors.default;
            return (
                <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${colorClass}`}>
                    {children}
                </span>
            );
        };

        const Disclaimer = () => (
            <div className="bg-amber-500/10 border-l-4 border-amber-500 p-4 rounded-r-lg my-4">
                <p className="text-amber-200 text-sm">
                    <strong>Research Prototype:</strong> QuantumHeal is developed for the Smart India Hackathon. It is not a certified medical device, and outputs should not be used for clinical decision-making.
                </p>
            </div>
        );

        // --- PAGE COMPONENTS ---

        const HomePage = ({ navigate }) => {
            return (
                <div className="space-y-24 pb-20">
                    {/* Hero Section */}
                    <section className="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden">
                        <div className="absolute inset-0 quantum-grid z-0"></div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-teal-500/10 rounded-full blur-[120px] -z-10 animate-pulse-slow"></div>
                        
                        <div className="container mx-auto px-4 relative z-10 text-center max-w-4xl">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-300 text-sm mb-6">
                                <span className="w-2 h-2 rounded-full bg-violet-400 animate-pulse"></span>
                                Smart India Hackathon Submission
                            </div>
                            <h1 className="text-5xl md:text-7xl font-heading font-bold text-white leading-tight mb-6 tracking-tight">
                                Quantum-enhanced intelligence for <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-violet-400 glow-text-teal">earlier diagnosis.</span>
                            </h1>
                            <p className="text-lg md:text-xl text-slate-400 mb-10 max-w-2xl mx-auto leading-relaxed">
                                A hybrid quantum-classical machine learning platform designed to detect complex disease patterns earlier, benchmarking NISQ-era variational quantum classifiers against classical state-of-the-art.
                            </p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                                <Button onClick={() => navigate('demo')} variant="primary" className="text-lg px-8 py-4">
                                    Launch Demo App
                                </Button>
                                <Button onClick={() => navigate('tech')} variant="secondary" className="text-lg px-8 py-4">
                                    View Architecture
                                </Button>
                            </div>
                            
                            <div className="mt-16 pt-10 border-t border-slate-800 flex flex-wrap justify-center items-center gap-8 text-slate-500 text-sm">
                                <span>Powered by:</span>
                                <span className="font-mono font-medium text-slate-300">PennyLane</span>
                                <span className="font-mono font-medium text-slate-300">Qiskit</span>
                                <span className="font-mono font-medium text-slate-300">FastAPI</span>
                                <span className="font-mono font-medium text-slate-300">React</span>
                            </div>
                        </div>
                    </section>

                    {/* Stats Section */}
                    <section className="container mx-auto px-4">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 lg:gap-8">
                            {[
                                { label: 'Validation Accuracy', value: `${CONFIG.stats.accuracy}%` },
                                { label: 'ROC AUC Score', value: CONFIG.stats.auc },
                                { label: 'Sensitivity', value: `${CONFIG.stats.sensitivity}%` },
                                { label: 'Specificity', value: `${CONFIG.stats.specificity}%` }
                            ].map((stat, i) => (
                                <Card key={i} className="text-center py-8 hover:border-teal-500/30 transition-colors">
                                    <div className="text-4xl font-heading font-bold text-white mb-2">{stat.value}</div>
                                    <div className="text-sm text-slate-400 uppercase tracking-wider font-medium">{stat.label}</div>
                                </Card>
                            ))}
                        </div>
                    </section>

                    {/* Features Section */}
                    <section className="container mx-auto px-4">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl font-heading font-bold text-white mb-4">Why Hybrid Quantum Machine Learning?</h2>
                            <p className="text-slate-400 max-w-2xl mx-auto">Combining the robust feature engineering of classical models with the high-dimensional pattern recognition potential of quantum circuits.</p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-6">
                            <Card icon={IconNetwork} title="Hybrid Architecture">
                                <p className="text-slate-400 text-sm leading-relaxed">Classical PCA dimensionality reduction paired with a 4-qubit Variational Quantum Classifier (VQC) designed for near-term (NISQ) devices.</p>
                            </Card>
                            <Card icon={IconActivity} title="Multimodal Fusion">
                                <p className="text-slate-400 text-sm leading-relaxed">Late-fusion architecture capable of synthesizing predictions from tabular health records and diagnostic imaging embeddings.</p>
                            </Card>
                            <Card icon={IconShield} title="Uncertainty Quantification">
                                <p className="text-slate-400 text-sm leading-relaxed">Leverages quantum measurement shot statistics to provide innate confidence bands and uncertainty metrics for every prediction.</p>
                            </Card>
                        </div>
                    </section>
                </div>
            );
        };

        const DemoPage = () => {
            const [activeTab, setActiveTab] = useState('screening');
            
            const tabs = [
                { id: 'screening', label: 'Patient Screening' },
                { id: 'multimodal', label: 'Multimodal Fusion' },
                { id: 'benchmarks', label: 'Model Benchmarks' },
                { id: 'explain', label: 'Explainability' }
            ];

            return (
                <div className="container mx-auto px-4 py-12 min-h-screen">
                    <div className="mb-8">
                        <h1 className="text-3xl font-heading font-bold text-white mb-2">Clinician Dashboard</h1>
                        <p className="text-slate-400">Interactive demonstration of the QuantumHeal inference pipeline.</p>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8">
                        {/* Sidebar */}
                        <div className="lg:w-64 flex-shrink-0">
                            <div className="glass-panel rounded-xl p-2 flex flex-row lg:flex-col gap-2 overflow-x-auto">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-3 text-left rounded-lg text-sm font-medium transition-colors whitespace-nowrap ${
                                            activeTab === tab.id 
                                            ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' 
                                            : 'text-slate-400 hover:bg-white/5 hover:text-white border border-transparent'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="flex-grow">
                            {activeTab === 'screening' && <ScreeningTab />}
                            {activeTab === 'multimodal' && <MultimodalTab />}
                            {activeTab === 'benchmarks' && <BenchmarksTab />}
                            {activeTab === 'explain' && <ExplainabilityTab />}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreeningTab = () => {
            const [features, setFeatures] = useState(MOCK_PATIENTS.benign);
            const [isPredicting, setIsPredicting] = useState(false);
            const [result, setResult] = useState(null);

            const handleSliderChange = (e) => {
                setFeatures({ ...features, [e.target.name]: parseFloat(e.target.value) });
                setResult(null); // Clear previous result
            };

            const loadPatient = (type) => {
                setFeatures(MOCK_PATIENTS[type]);
                setResult(null);
            };

            const runPrediction = async () => {
    setIsPredicting(true);
    setResult(null);

    try {
        const biomarkers = [
            Number(features.radius),
            Number(features.texture),
            Number(features.perimeter),
            Number(features.area),
            Number(features.smoothness),

            0.08129,
            0.06664,
            0.04781,
            0.1885,
            0.05766,
            0.2699,
            0.7886,
            2.058,
            23.56,
            0.008462,
            0.0146,
            0.02387,
            0.01315,
            0.0198,
            0.0023,
            15.11,
            19.26,
            99.7,
            711.2,
            0.144
        ];

        // 👇 PUT YOUR fetch() HERE
        const response = await fetch(`${API_BASE_URL}/predict`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                patient_id: `demo-${Date.now()}`,
                biomarkers: biomarkers
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || `API error: ${response.status}`
            );
        }

        const probability = Number(data.fused_probability);

        const riskPercent = probability * 100;

        const uncertainty =
            Number(data.arms?.tabular?.uncertainty_std ?? 0) * 100;

        setResult({
            risk: riskPercent.toFixed(1),

            class:
                data.prediction === "disease-positive"
                    ? "Malignant / High Risk"
                    : "Benign / Low Risk",

            confidence:
                (
                    Math.max(probability, 1 - probability) * 100
                ).toFixed(1),

            uncertainty: uncertainty.toFixed(1),

            shots: 200,

            lowConfidence: Boolean(data.low_confidence),

            backend: data.backend || "default.qubit"
        });

    } catch (error) {
        console.error("QuantumHeal API error:", error);

        setResult({
            error:
                error.message ||
                "Unable to connect to QuantumHeal backend."
        });

    } finally {
        setIsPredicting(false);
    }
};
            return (
                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <Disclaimer />
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card title="Patient Features (Wisconsin Breast Cancer)" icon={IconActivity}>
                            <div className="flex gap-2 mb-6">
                                <Button variant="outline" onClick={() => loadPatient('benign')} className="text-xs py-1.5 px-3">Load Sample A (Low Risk)</Button>
                                <Button variant="outline" onClick={() => loadPatient('malignant')} className="text-xs py-1.5 px-3">Load Sample B (High Risk)</Button>
                            </div>
                            
                            <div className="space-y-5">
                                {[
                                    { name: 'radius', label: 'Mean Radius', min: 5, max: 30, step: 0.1 },
                                    { name: 'texture', label: 'Mean Texture', min: 10, max: 40, step: 0.1 },
                                    { name: 'perimeter', label: 'Mean Perimeter', min: 40, max: 190, step: 1 },
                                    { name: 'area', label: 'Mean Area', min: 200, max: 2500, step: 10 },
                                    { name: 'smoothness', label: 'Mean Smoothness', min: 0.05, max: 0.17, step: 0.001 },
                                ].map((field) => (
                                    <div key={field.name}>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-300 font-medium">{field.label}</span>
                                            <span className="text-teal-400 font-mono">{features[field.name]}</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            name={field.name}
                                            min={field.min} max={field.max} step={field.step}
                                            value={features[field.name]} 
                                            onChange={handleSliderChange}
                                            className="range-slider"
                                        />
                                    </div>
                                ))}
                            </div>

                            <Button
